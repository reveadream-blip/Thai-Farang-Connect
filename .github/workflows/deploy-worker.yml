# Déploie le Worker OpenNext (SSR + middleware). Sans cette étape, seuls les fichiers
# statiques dans .open-next/assets sont publiés — le site renvoie 404 sur / et les routes dynamiques.
name: Deploy OpenNext Worker

on:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy to Cloudflare Workers
        run: npm run pages:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_API_URL: https://thai-farang-api.contact-applimanagement.workers.dev
          NEXT_PUBLIC_SITE_URL: https://thai-farang-connect.contact-applimanagement.workers.dev
