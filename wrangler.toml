# Cloudflare Pages (CI Git uniquement) — pas de main/assets ici.
# OpenNext Worker : wrangler.opennext.jsonc + flag --config sur la commande de build.
# Ordre de découverte Wrangler : wrangler.json > wrangler.jsonc > wrangler.toml
# → pas de wrangler.json(c) à la racine pour que ce fichier soit utilisé par Pages.

name = "thai-farang-connect"
pages_build_output_dir = "./.open-next/assets"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]
